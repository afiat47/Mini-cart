<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Products</title>
</head>
<body>

<h1 th:text="${pageTitle}">Products</h1>
<form th:action="@{/products/search}" method="get">

    <input type="text"
           name="item"
           placeholder="Search products">

    <button type="submit">Search</button>

</form>

<br>

<div th:each="product : ${products}">
    <h3 th:text="${product.name}">Product Name</h3>
    <p>Price: <span th:text="${product.price}">0</span></p>
    <p th:text="${product.description}">Description</p>
    <a th:href="@{/products/edit/{id}(id=${product.id})}">
        Edit
    </a>
    <form th:action="@{/products/delete/{id}(id=${product.id})}"
          method="post"
          onsubmit="return confirm('Delete this product?');">

        <button type="submit">Delete</button>

    </form>
    <form th:action="@{/products/cart/add/{id}(id=${product.id})}"
          method="post">

        <button type="submit">Add to Cart</button>

    </form>
    <hr>
</div>

<a href="/">Go Home</a>

</body>
</html>
